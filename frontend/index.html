<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Тема до загрузки бандла, чтобы страница не мигнула другой темой. Делает то же, что
      // useThemeStore: сохранённая тема, иначе по схеме устройства (SYSTEM_THEMES).
      // Список id — как THEMES в src/theme/themes.ts (сверяет themes.spec.ts)
      try {
        const themes = ['light', 'dark']
        const saved = localStorage.getItem('theme')
        const dark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = themes.includes(saved) ? saved : dark ? 'dark' : 'light'
      } catch {}
    </script>
    <!-- Основной текст (Inter) — сразу, параллельно с бандлом: иначе браузер узнает о шрифте
         только после запуска JS и отрисовки. Пути — как в src/assets/fonts.css -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>School</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
