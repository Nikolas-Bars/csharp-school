name: csharp-school-web

services:
  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile_local
    container_name: csharp-school-web
    env_file: .env
    ports:
      - "${WEB_PORT:-5390}:5390"
    volumes:
      - .:/app
      - /app/node_modules
      # Курсы — для тестов контента английского (src/__tests__/englishContent.spec.ts) и e2e
      - ../content:/content:ro
    restart: unless-stopped
