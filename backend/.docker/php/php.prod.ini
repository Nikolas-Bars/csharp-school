; Поверх php.ini-production (Dockerfile_prod)
expose_php = Off
memory_limit = 256M
post_max_size = 2M
upload_max_filesize = 2M
max_execution_time = 30
max_input_time = 60
default_socket_timeout = 60
date.timezone = UTC

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Воркеры RoadRunner — это php-cli, поэтому OPcache включается и для CLI.
; Код в образе не меняется: проверять время изменения файлов не нужно
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Комментарии нужны: spatie/laravel-data читает типы коллекций из PHPDoc
opcache.save_comments = 1
