name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# То же, что make check, плюс проверка уязвимостей зависимостей
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, redis, sockets
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Уязвимости и заброшенные пакеты
        run: composer audit --locked --no-dev --abandoned=fail

      - name: php-cs-fixer
        run: composer lint-check

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer test
