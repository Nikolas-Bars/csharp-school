name: frontend

# При изменениях в frontend/ и в курсе английского: его тесты контента — в Vitest фронта
# (src/__tests__/englishContent.spec.ts), на той же проверке ответов, что у ученика
on:
  pull_request:
    paths:
      ['frontend/**', 'content/english/**', 'content/courses.json', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths:
      ['frontend/**', 'content/english/**', 'content/courses.json', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# То же, что make check, плюс уязвимости зависимостей и production-сборка
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Уязвимости
        run: npm audit --omit=dev --audit-level=high

      - name: oxlint, ESLint, Prettier
        run: npm run lint-check

      - name: Типы
        run: npm run type-check

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build-only
