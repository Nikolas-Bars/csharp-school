name: deploy

# Production-образы собираются и проверяются целиком (deploy/check.sh): стек поднимается на
# раннере, deploy/smoke.sh проверяет API, SPA, runner, сжатие и заголовки, а Playwright в Chromium
# (CHECK_E2E=1, frontend/e2e) решает задачу урока: компилятор в Web Worker, ошибки по-русски,
# таймаут бесконечного цикла, без нарушений CSP. На Pull Request образы никуда не публикуются;
# после мёржа в main в GHCR уходят только образы, прошедшие эти проверки
# (ghcr.io/<владелец>/csharp-school-{api,web}: коммит и latest) — их забирает deploy/deploy.sh на
# сервере (собирать там нельзя: сборке runner нужно 2+ ГБ памяти). Сам деплой — вручную.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'backend/**'
      - 'frontend/**'
      - 'runner/src/**'
      - 'runner/build/**'
      - 'runner/*.props'
      - 'runner/global.json'
      - 'content/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'backend/**'
      - 'frontend/**'
      - 'runner/src/**'
      - 'runner/build/**'
      - 'runner/*.props'
      - 'runner/global.json'
      - 'content/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образов, запуск стека, smoke и проверка в браузере
        run: deploy/check.sh
        env:
          CHECK_E2E: '1'
          CHECK_E2E_RESULTS: ${{ runner.temp }}/e2e-results
          # В main проверенные образы остаются для публикации
          KEEP_IMAGES: ${{ github.event_name == 'push' && '1' || '0' }}

      - name: Отчёт Playwright (трассировка упавшего теста)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Публикация в GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/csharp-school"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in api web; do
            for tag in "$GITHUB_SHA" latest; do
              docker tag "csharp-school-$image:check" "$prefix-$image:$tag"
              docker push --quiet "$prefix-$image:$tag"
            done
          done
          echo "Образы: $prefix-{api,web}:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
