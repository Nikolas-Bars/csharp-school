name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# То же, что make check, плюс уязвимости зависимостей и production-сборка
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Уязвимости
        run: npm audit --omit=dev --audit-level=high

      - name: oxlint, ESLint, Prettier
        run: npm run lint-check

      - name: Типы
        run: npm run type-check

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build-only
